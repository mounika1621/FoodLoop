<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FoodLoop Register</title><link rel="stylesheet" href="assets/css/style.css"></head><body><div class="login-wrap"><div class="login card"><div class="login-side"><div class="brand">Food<span>Loop</span></div><h1>Join the redistribution network.</h1><p class="muted">Create a donor, recipient or volunteer account.</p></div><div class="login-box"><h2>Create account</h2><form id="registerForm"><div class="form-grid"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" minlength="6" required></div><div class="field"><label>Role</label><select name="role"><option>DONOR</option><option>RECIPIENT</option><option>VOLUNTEER</option></select></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Organization</label><input name="organization" placeholder="NGO / Hotel / Business"></div><div class="field full"><label>Location</label><input name="location" placeholder="Area, City" required></div></div><button class="btn">Create Account</button><div id="registerMsg" class="msg"></div></form><p><a href="index.html" style="color:var(--accent)">← Back to login</a></p></div></div></div><script src="assets/js/app.js"></script></body></html>
